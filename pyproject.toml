[project]
name = "immo-scanner"
version = "0.1.0"
description = "Crawl, enrich and explore the Berlin property market"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13",
    "geoalchemy2>=0.15",
    "geopandas>=1.0",
    "httpx>=0.27",
    "openpyxl>=3.1",
    "pandas>=2.2",
    "pdfplumber>=0.11",
    "playwright>=1.45",
    "psycopg[binary]>=3.2",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyogrio>=0.9",
    "rich>=13.7",
    "selectolax>=0.3.21",
    "shapely>=2.0",
    "sqlalchemy>=2.0.30",
    "tenacity>=8.3",
    "typer>=0.12",
]

[project.optional-dependencies]
commute = ["r5py>=0.1.1"]
analysis = [
    "jupyterlab>=4.2",
    "matplotlib>=3.9",
    "seaborn>=0.13",
    "statsmodels>=0.14",
]
app = [
    "pydeck>=0.9",
    "statsmodels>=0.14",
    "streamlit>=1.36",
]

[project.scripts]
immo = "immo_scanner.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/immo_scanner"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"*.ipynb" = ["E501"]
"tests/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "app"]
